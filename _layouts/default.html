<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
    <link rel="alternate" type="application/atom+xml" title="{{ site.name }}" href="{{ site.baseurl }}/feed.xml">
    {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
    {% seo %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="site-title" href="{{ site.baseurl }}/">龴ↀ◡ↀ龴 {{ site.name }}</a>
      <p class="site-description">{{ site.description }}</p>
      <nav aria-label="Primary navigation">
        <a href="{{ site.baseurl }}/"{% if page.url == "/" %} aria-current="page"{% endif %}>blog</a>
        <a href="{{ site.baseurl }}/projects/"{% if page.url == "/projects/" %} aria-current="page"{% endif %}>projects</a>
      </nav>
    </header>

    <main id="main">
      {{ content }}
    </main>

    {% include analytics.html %}
  </body>
</html>
