---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-date">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>

  {{ content }}

  <nav class="post-navigation" aria-label="Post navigation">
    {% if page.previous %}
      <a href="{{ site.baseurl }}{{ page.previous.url }}">← {{ page.previous.title }}</a>
    {% endif %}
    {% if page.next %}
      <a class="post-navigation-next" href="{{ site.baseurl }}{{ page.next.url }}">{{ page.next.title }} →</a>
    {% endif %}
  </nav>

  {% include disqus.html %}
</article>
