---
layout: default
---

<div class="about-section">
  <img src="{{ site.baseurl }}/images/cropped_circle_image.png" alt="Csaba Ekart"/>
  <div class="about-text">
    <strong>Hello there! 👋 I'm Csaba.</strong><br>
    Software Engineer from Budapest.<br>
    I enjoy building games, native stuff, and making things work.
  </div>
</div>

<hr class="divider"/>
<div class="posts">
  {% for post in site.posts %}
    <article class="post">

      <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>

      <div class="date">
        {{ post.date | date: "%B %e, %Y" }}
      </div>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>
    </article>
  {% endfor %}
</div>
